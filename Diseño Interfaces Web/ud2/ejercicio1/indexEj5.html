<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Estilos en línea</title>
</head>
<body>
    <h1 style="font-family: Arial, sans-serif; color: #1f2937; text-align: center;">Botones con estilos en línea</h1>

    <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px;">
        <button style="background-color: #2563eb; color: #ffffff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 700; cursor: pointer;">Primario</button>
        <button style="background-color: #16a34a; color: #ffffff; border: 2px solid #15803d; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 700; cursor: pointer;">Éxito</button>
        <button style="background-color: #f59e0b; color: #1f2937; border: 2px solid #d97706; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 700; cursor: pointer;">Advertencia</button>
    </div>

    <!--
        a) No se recomienda porque mezcla el contenido HTML con la presentación, hace que el mantenimiento sea más difícil y repite estilos en cada etiqueta.
        b) Puede ser útil para pruebas rápidas, ajustes puntuales, estilos temporales o para sobrescribir una regla concreta en circunstancias muy específicas.
    -->
</body>
</html>
