<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="formulario">
        <textarea name="mitexto" placeholder="Introduce una frase" cols="30" rows="5"></textarea>
        <br>
        <input type="button" value="clickear" onclick="pulsar()"></input>
    </form>
    <div id="palabras"></div>
    <div id="calificaciones"></div>
<script>
    /* Para el div palabras: 
    - Calcula y muestra el numero de palabras que están escritas en el textarea
    - Muestra la ultima y la primera palabra del textarea
    */


    /* Para el div calificaciones: 
    Dado el siguiente array de notas de clase en la 1ª Evaluación. 
    var notas = new Array(4.5, 4, 6, 1, 7.5, 10, 5.25, 4.5, 2, 1, 8,7.5, 1, 7.5, 8);
    - Sacar el numero de alumnos aprobados
    - Dado este array, sacar por pantalla todas las notas que no están repetidas
    - Crea una funcion para comprobar las notas que estan por debajo de 5. Llama a esta función para sacar las notas pares de los alumnos que han suspendido
    - Sacar las notas impares de los alumnos que han sacado al menos un 7
    - Elimina del array las notas por debajo de 5
    - Crea una función aleatoria que calcule numeros entre 5 y 10 sin decimales
    - Llama a esta funcion aleatoria para rellenar el array, respetando las notas que no han sido eliminadas. 
    - Muestra por pantalla el array con los nuevos elementos ordenandos de mayor a menor.

    NOTA1: Emplea siempre que se pueda metodos y propiedades del objeto Array
    NOTA2: Emplea if, for, for-in, for-of, do-while, while... */

    var notas = new Array(4.5, 4, 6, 1, 7.5, 10, 5.25, 4.5, 2, 1, 8, 7.5, 1, 7.5, 8);

    function esMenorQueCinco(nota) {
        return nota < 5;
    }

    function aleatorioEntreCincoYDiez() {
        return Math.floor(Math.random() * 6) + 5;
    }

    function pulsar() {
        var texto = document.formulario.mitexto.value;
        var palabras = texto.trim().split(/\s+/).filter(function (palabra) {
            return palabra.length > 0;
        });

        var primera = palabras[0] || "No hay palabras";
        var ultima = palabras[palabras.length - 1] || "No hay palabras";

        document.getElementById("palabras").innerHTML =
            "<p>Número de palabras: " + palabras.length + "</p>" +
            "<p>Primera palabra: " + primera + "</p>" +
            "<p>Última palabra: " + ultima + "</p>";

        var aprobados = notas.filter(function (nota) {
            return nota >= 5;
        }).length;

        var noRepetidas = notas.filter(function (nota, indice, arreglo) {
            return arreglo.indexOf(nota) === indice;
        });

        var suspendidas = notas.filter(esMenorQueCinco);
        var suspendidasPares = suspendidas.filter(function (nota) {
            return nota % 2 === 0;
        });

        var conAlMenosSiete = notas.filter(function (nota) {
            return nota >= 7;
        });
        var imparesConSiete = conAlMenosSiete.filter(function (nota) {
            return nota % 2 !== 0;
        });

        var notasSinSuspensos = notas.filter(function (nota) {
            return !esMenorQueCinco(nota);
        });

        var arrayRellenado = [];
        var i = 0;
        while (i < notas.length) {
            if (esMenorQueCinco(notas[i])) {
                arrayRellenado.push(aleatorioEntreCincoYDiez());
            } else {
                arrayRellenado.push(notas[i]);
            }
            i++;
        }

        do {
            arrayRellenado.sort(function (a, b) {
                return b - a;
            });
        } while (false);

        var salida =
            "<p>Número de alumnos aprobados: " + aprobados + "</p>" +
            "<p>Notas no repetidas: " + noRepetidas.join(", ") + "</p>" +
            "<p>Notas pares de los suspendidos: " + suspendidasPares.join(", ") + "</p>" +
            "<p>Notas impares de los que han sacado al menos un 7: " + imparesConSiete.join(", ") + "</p>" +
            "<p>Notas tras eliminar las menores de 5: " + notasSinSuspensos.join(", ") + "</p>" +
            "<p>Array rellenado con aleatorios y ordenado de mayor a menor: " + arrayRellenado.join(", ") + "</p>";

        document.getElementById("calificaciones").innerHTML = salida;
    }

    /* Ejemplo de uso de bucles y estructuras   */
    var contador = 0;
    for (var indice in notas) {
        contador++;
    }

    var total = 0;
    for (var i = 0; i < notas.length; i++) {
        total += notas[i];
    }

    var notasTexto = "";
    for (var nota of notas) {
        notasTexto += nota + " ";
    }

    if (contador > 0) {
        console.log("Total de notas: " + contador);
        console.log("Suma total: " + total);
        console.log("Notas: " + notasTexto.trim());
    }
</script>
</body>
</html>
